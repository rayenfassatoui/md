<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown to PDF</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.4.0/github-markdown-light.min.css">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <div class="menu-container" id="menu-container">
                <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle Menu">
                    <span class="line line1"></span>
                    <span class="line line2"></span>
                    <span class="line line3"></span>
                </button>
                <nav class="nav-menu" id="nav-menu">
                    <button id="generate-btn">
                        <span class="btn-text">Generate PDF</span>
                        <span class="btn-loading" style="display: none;">Generating...</span>
                    </button>
                    <button id="focus-mode-btn">Toggle Focus</button>
                    <button id="theme-switcher-btn">Switch Theme</button>
                </nav>
            </div>

            <div id="editor-panel" class="editor-section">
                <textarea id="md-input" placeholder="Paste your Markdown here..." aria-label="Markdown input area"></textarea>
            </div>
            <div class="resizer" id="resizer"></div>
            <div id="preview-panel" class="preview-section">
                <div id="preview" class="markdown-body"></div>
            </div>
        </div>
    </div>

    <!-- Tiny settings panel -->
    <div id="mini-settings" class="mini-settings" aria-label="PDF settings">
        <div class="mini-row">
            <label for="diagram-scale">Diagram size</label>
            <input id="diagram-scale" type="range" min="50" max="100" value="80" step="5" />
            <span id="diagram-scale-val">80%</span>
        </div>
        <div class="mini-row">
            <label for="pdf-margin">Margins</label>
            <select id="pdf-margin">
                <option value="10">10mm</option>
                <option value="12" selected>12mm</option>
                <option value="15">15mm</option>
                <option value="20">20mm</option>
            </select>
        </div>
        <div class="mini-row">
            <label for="keep-one-page">Keep diagram on one page</label>
            <input id="keep-one-page" type="checkbox" checked />
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
